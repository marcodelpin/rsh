// rsh rendezvous + relay protocol.
// Wire-compatible with RustDesk hbbs/hbbr (field numbers match).
// Protocols are not copyrightable (Oracle v. Google, 2021).
//
// Copyright (c) 2026 Marco Del Pin — MIT License.

syntax = "proto3";
package rdv;

// --- Enums ---

enum NatType {
  UNKNOWN_NAT = 0;
  ASYMMETRIC = 1;
  SYMMETRIC = 2;
}

enum ConnType {
  DEFAULT_CONN = 0;
  FILE_TRANSFER = 1;
  PORT_FORWARD = 2;
  RDP = 3;
  VIEW_CAMERA = 4;
  TERMINAL = 5;
}

// --- Registration ---

message RegisterPeer {
  string id = 1;
  int32 serial = 2;
  // rsh extensions (field 3+, ignored by RustDesk clients)
  string group_hash = 3;   // SHA256(enrollment_token), hex-encoded
  string hostname = 4;
  string platform = 5;     // "windows" or "linux"
  int32 service_port = 6;  // rsh command listener port (e.g. 8822) — kept for compat
  // Encrypted network info for LAN discovery (envelope encryption).
  // Opaque to hbbs — only group members with the private key can decrypt.
  bytes encrypted_net_info = 7;
  // All ports this server listens on, with type and capabilities.
  // Supersedes service_port (field 6) when non-empty.
  repeated PortInfo ports = 8;
  // rsh-5264.1 heartbeat-feedback fields (ignored by RustDesk clients).
  // Servers report their compiled version + last self-update outcome at
  // every registration so `mrsh fleet update`/`status` can read fleet
  // state from rdv (single round-trip) instead of TCP-probing each host.
  string current_version = 9;       // mrsh server version, e.g. "1.10.29"
  string last_update_status = 10;   // "success" | "failed:<reason>" | "never"
  int64 last_update_at_unix = 11;   // unix-seconds timestamp, 0 if never
  // rsh-5264.5 staged-rollout fields (ignored by RustDesk and pre-5264.5 servers).
  string track = 12;                // "stable" | "canary" | "dev" (default "stable")
  bool auto_upgrade = 13;           // true = host opts in to rdv-driven self-update
}

// Describes a single listening port and its capabilities.
message PortInfo {
  uint32 port = 1;
  string instance_type = 2;     // "system" or "tray"
  repeated string caps = 3;     // capability strings (same as auth caps)
}

message RegisterPeerResponse {
  bool request_pk = 2;
}

message RegisterPk {
  string id = 1;
  bytes uuid = 2;
  bytes pk = 3;
  string old_id = 4;
  bool no_register_device = 5;
}

message RegisterPkResponse {
  enum Result {
    OK = 0;
    UUID_MISMATCH = 2;
    ID_EXISTS = 3;
    TOO_FREQUENT = 4;
    INVALID_ID_FORMAT = 5;
    NOT_SUPPORT = 6;
    SERVER_ERROR = 7;
  }
  Result result = 1;
  int32 keep_alive = 2;
}

// --- Punch Hole (NAT traversal) ---

message PunchHoleRequest {
  string id = 1;
  NatType nat_type = 2;
  string licence_key = 3;
  ConnType conn_type = 4;
  string token = 5;
  string version = 6;
  int32 udp_port = 7;
  bool force_relay = 8;
  int32 upnp_port = 9;
  bytes socket_addr_v6 = 10;
}

message PunchHole {
  bytes socket_addr = 1;
  string relay_server = 2;
  NatType nat_type = 3;
  int32 udp_port = 4;
  bool force_relay = 5;
  int32 upnp_port = 6;
  bytes socket_addr_v6 = 7;
}

message PunchHoleSent {
  bytes socket_addr = 1;
  string id = 2;
  string relay_server = 3;
  NatType nat_type = 4;
  string version = 5;
  int32 upnp_port = 6;
  bytes socket_addr_v6 = 7;
}

message PunchHoleResponse {
  bytes socket_addr = 1;
  bytes pk = 2;
  enum Failure {
    ID_NOT_EXIST = 0;
    PEER_ON_LAN = 1;
    OFFLINE = 2;
    LICENSE_MISMATCH = 3;
    LICENSE_OVERUSE = 4;
  }
  Failure failure = 3;
  string relay_server = 4;
  oneof union {
    NatType nat_type = 5;
    bool is_local = 6;
  }
  string other_failure = 7;
  // Forwarded from RegisterPeer — encrypted network info for LAN discovery.
  bytes encrypted_net_info = 8;
  // Forwarded from RegisterPeer — all listening ports with capabilities.
  repeated PortInfo ports = 9;
}

// --- Relay ---

message RequestRelay {
  string id = 1;
  string uuid = 2;
  bytes socket_addr = 3;
  string relay_server = 4;
  bool secure = 5;
  string licence_key = 6;
  ConnType conn_type = 7;
  string token = 8;
  // rsh extension: target port on the device (0 = default 8822, 9822 = tray)
  int32 target_port = 9;
}

message RelayResponse {
  bytes socket_addr = 1;
  string uuid = 2;
  string relay_server = 3;
  oneof union {
    string id = 4;
    bytes pk = 5;
  }
  string refuse_reason = 6;
  string version = 7;
  // rsh extension: requested target port (0 = default 8822, 9822 = tray)
  int32 target_port = 8;
}

// --- Same-LAN detection ---

message FetchLocalAddr {
  bytes socket_addr = 1;
  string relay_server = 2;
  bytes socket_addr_v6 = 3;
  // rsh-64x9 2026-05-21: same-NAT peers benefit from LAN discovery too.
  // Backward-compatible (new field; old clients/servers default to empty).
  bytes encrypted_net_info = 4;
}

message LocalAddr {
  bytes socket_addr = 1;
  bytes local_addr = 2;
  string relay_server = 3;
  string id = 4;
  string version = 5;
  bytes socket_addr_v6 = 6;
}

// --- Config + Discovery ---

message ConfigUpdate {
  int32 serial = 1;
  repeated string rendezvous_servers = 2;
}

message SoftwareUpdate {
  string url = 1;
}

message TestNatRequest {
  int32 serial = 1;
}

message TestNatResponse {
  int32 port = 1;
  ConfigUpdate cu = 2;
}

// --- Encrypted LAN Discovery (rsh extension) ---
// Envelope encryption: payload encrypted with random AES-256-GCM key,
// then the AES key is encrypted once per group with ECIES (X25519 + AES-GCM).
// hbbs stores and forwards the blob opaque — only group members can decrypt.

message EncryptedNetworkInfo {
  bytes encrypted_data = 1;        // AES-256-GCM(sym_key, serialized NetworkInfo)
  bytes nonce = 2;                 // 12-byte AES-GCM nonce
  repeated GroupKeyEntry keys = 3; // sym_key encrypted per group
}

message GroupKeyEntry {
  string group_hash = 1;           // identifies which group
  bytes ephemeral_pubkey = 2;      // 32-byte X25519 ephemeral public key
  bytes encrypted_key = 3;         // AES-GCM(DH(ephemeral, group_pub), sym_key)
  bytes key_nonce = 4;             // 12-byte nonce for the key encryption
}

message NetworkInfo {
  repeated NetInterface interfaces = 1;
  string hostname = 2;
  uint32 service_port = 3;
  uint32 tray_port = 4;
}

message NetInterface {
  string name = 1;      // "Ethernet", "Wi-Fi", "Tailscale"
  string ip = 2;        // "192.0.2.50"
  string netmask = 3;   // "255.255.255.0"
  string gateway = 4;   // "192.0.2.1"
}

message PeerDiscovery {
  string cmd = 1;
  string mac = 2;
  string id = 3;
  string username = 4;
  string hostname = 5;
  string platform = 6;
  string misc = 7;
}

message OnlineRequest {
  string id = 1;
  repeated string peers = 2;
}

message OnlineResponse {
  bytes states = 1;
}

// --- Health + Metrics (rsh extensions) ---

message HealthCheck {
  string token = 1;
}

message HealthResponse {
  uint64 timestamp = 1;
  uint32 peers_online = 2;
  uint32 relays_active = 3;
  string version = 4;
}

message MetricsRequest {
  string auth_token = 1;
}

message MetricsResponse {
  bytes json_payload = 1;
}

// --- Fleet enrollment / group discovery (rsh extensions) ---

message GroupQuery {
  string group_hash = 1;   // SHA256(enrollment_token), hex
  bytes hmac_proof = 2;    // HMAC-SHA256(nonce_bytes, enrollment_token)
  uint64 nonce = 3;        // timestamp-based nonce (unix secs)
}

message GroupQueryResponse {
  repeated GroupPeer peers = 1;
}

message GroupPeer {
  string device_id = 1;
  string hostname = 2;
  string platform = 3;
  bytes socket_addr = 4;   // AddrMangle-encoded
  uint64 last_seen_secs = 5;  // seconds since UNIX epoch
  int32 service_port = 6;  // rsh command listener port (0 = default 8822) — compat
  repeated PortInfo ports = 7;  // all listening ports with capabilities
  bytes encrypted_net_info = 8; // ECIES-encrypted LAN IPs, ports, hostname
  // rsh-5264.1 heartbeat-feedback fields (forwarded from RegisterPeer).
  string current_version = 9;       // mrsh server version, e.g. "1.10.29"
  string last_update_status = 10;   // "success" | "failed:<reason>" | "never"
  int64 last_update_at_unix = 11;   // unix-seconds timestamp, 0 if never
  // rsh-5264.5 staged-rollout fields (forwarded from RegisterPeer).
  string track = 12;                // "stable" | "canary" | "dev"
  bool auto_upgrade = 13;           // true = host opts in to rdv-driven self-update
}

// --- Fleet peer list (rsh extension) ---

message ListPeers {
  string licence_key = 1;  // must match server's --key
}

message ListPeersResponse {
  repeated GroupPeer peers = 1;  // reuse GroupPeer format
}

// --- VersionAdvert (rsh-5264.3, per-platform/per-track latest version) ---
//
// rdv stores the operator-published "latest version available" per
// (platform, track) tuple. Servers query at heartbeat with their
// (platform, track, current_version); rdv replies with the advert when a
// newer version is available, otherwise update_available=false.

message VersionAdvert {
  string platform = 1;        // "windows-msvc" | "linux-glibc" | "linux-musl" | "macos"
  string track = 2;           // "stable" | "canary" | "dev"
  string latest_version = 3;  // semver, e.g. "1.10.30"
  string download_url = 4;    // optional; where rdv hosts the binary (relay endpoint)
  bytes signature = 5;        // Ed25519 signature of binary, from release-signing key
  int64 published_at_unix = 6;
}

// Operator-side: publish a VersionAdvert (signed by the release-signing key).
// `operator_signature` covers the canonical string
// `<platform>|<track>|<version>` so an attacker who reuses a binary signature
// cannot publish under a different (platform, track, version) tuple.
message PublishVersionRequest {
  VersionAdvert advert = 1;
  bytes binary_blob = 2;          // optional inline binary blob (small releases)
  bytes operator_signature = 3;   // Ed25519 sig of "<platform>|<track>|<version>"
}

message PublishVersionResponse {
  bool accepted = 1;
  string error_message = 2;
}

// Server-side: query latest version for my platform+track tuple.
message QueryVersionRequest {
  string platform = 1;
  string track = 2;
  string current_version = 3;  // server's current version, for "no update needed" reply
}

message QueryVersionResponse {
  bool update_available = 1;
  VersionAdvert advert = 2;     // present iff update_available=true
}

// rsh-5264.6: server-side blob fetch. After QueryVersion returns an advert,
// the server fetches the actual binary bytes from rdv via this RPC. MUST be
// sent over TCP — payload (7-8 MB) exceeds UDP packet limits.
message FetchBinaryRequest {
  string platform = 1;          // matches the advert's platform
  string track = 2;             // matches the advert's track
  string version = 3;           // pinned version OR latest_version from advert
}

message FetchBinaryResponse {
  bool found = 1;
  bytes binary_blob = 2;        // raw binary bytes (empty when found=false)
  bytes signature = 3;           // Ed25519 sig of binary_blob (re-served for
                                 // independent verification — same value as
                                 // VersionAdvert.signature for the matching
                                 // (platform, track, version) tuple)
  string error_message = 4;     // populated when found=false
}

// --- Top-level envelope ---
// Field numbers match RustDesk RendezvousMessage for backwards compatibility.

message RendezvousMessage {
  oneof union {
    RegisterPeer register_peer = 6;
    RegisterPeerResponse register_peer_response = 7;
    PunchHoleRequest punch_hole_request = 8;
    PunchHole punch_hole = 9;
    PunchHoleSent punch_hole_sent = 10;
    PunchHoleResponse punch_hole_response = 11;
    FetchLocalAddr fetch_local_addr = 12;
    LocalAddr local_addr = 13;
    ConfigUpdate configure_update = 14;
    RegisterPk register_pk = 15;
    RegisterPkResponse register_pk_response = 16;
    SoftwareUpdate software_update = 17;
    RequestRelay request_relay = 18;
    RelayResponse relay_response = 19;
    TestNatRequest test_nat_request = 20;
    TestNatResponse test_nat_response = 21;
    PeerDiscovery peer_discovery = 22;
    OnlineRequest online_request = 23;
    OnlineResponse online_response = 24;
    // field 25 reserved (KeyExchange in RustDesk, not used by rsh)
    HealthCheck health_check = 26;
    // rsh extensions (field numbers > 30, ignored by RustDesk clients)
    HealthResponse health_response = 31;
    MetricsRequest metrics_request = 32;
    MetricsResponse metrics_response = 33;
    GroupQuery group_query = 34;
    GroupQueryResponse group_query_response = 35;
    ListPeers list_peers = 36;
    ListPeersResponse list_peers_response = 37;
    // rsh-5264.3 VersionAdvert protocol
    PublishVersionRequest publish_version_request = 38;
    PublishVersionResponse publish_version_response = 39;
    QueryVersionRequest query_version_request = 40;
    QueryVersionResponse query_version_response = 41;
    // rsh-5264.6 binary blob fetch (TCP transport only)
    FetchBinaryRequest fetch_binary_request = 42;
    FetchBinaryResponse fetch_binary_response = 43;
  }
}
